version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: otklik_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: otklik_db
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d otklik_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: otklik_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/otklik_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data: