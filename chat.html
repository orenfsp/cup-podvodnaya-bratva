<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа «Отклик» — Безопасный чат</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-sm">💬</div>
                <div>
                    <span class="font-extrabold text-slate-900 text-base block">Безопасный чат</span>
                    <span id="headerTracking" class="text-xs font-mono text-sky-600 font-semibold"></span>
                </div>
            </div>
            <button onclick="goBack()" class="text-sm font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl transition-colors">На главную страницу</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 flex flex-col">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex-1 flex flex-col overflow-hidden max-h-[75vh]">
            
            <div id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col">
                <div class="text-center text-slate-400 text-sm py-4">Загрузка истории сообщений...</div>
            </div>

            <div class="p-4 border-t border-slate-200 bg-white flex gap-3">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-sm focus:outline-none focus:border-sky-500 focus:bg-white transition-all">
                <button onclick="sendMessage()" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md shadow-sky-600/20 transition-all text-sm">Отправить</button>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400">
        Платформа «Отклик» &copy; 2026. Анонимный защищенный канал связи.
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trackingCode = urlParams.get('tracking');

        if (!trackingCode) {
            alert('Трек-номер не указан');
            window.location.href = 'applicant.html';
        } else {
            document.getElementById('headerTracking').innerText = `Заявка: ${trackingCode}`;
            loadMessages();
            setInterval(loadMessages, 5000);
        }

        function goBack() {
            // Укажи здесь название главного файла вашей страницы (applicant.html или index.html)
            window.location.href = `applicant.html`;
        }

        async function loadMessages() {
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/reports/${trackingCode}/messages`);
                if (response.ok) {
                    const messages = await response.json();
                    const container = document.getElementById('chatMessages');

                    if (messages.length === 0) {
                        container.innerHTML = '<div class="text-center text-slate-400 text-sm py-10">В этом чате пока нет сообщений. Напишите первое сообщение модератору.</div>';
                        return;
                    }

                    container.innerHTML = messages.map(m => {
                        const isApplicant = m.sender_type === 'applicant';
                        const alignClass = isApplicant ? 'ml-auto bg-sky-600 text-white' : 'mr-auto bg-slate-100 text-slate-900 border border-slate-200';
                        const senderTitle = isApplicant ? 'Вы (Заявитель)' : 'Модератор';
                        
                        return `
                            <div class="max-w-[80%] rounded-2xl px-4 py-3 text-sm shadow-sm space-y-1 ${alignClass}">
                                <div class="text-[10px] font-bold uppercase tracking-wider opacity-75">${senderTitle}</div>
                                <div class="leading-relaxed whitespace-pre-wrap break-words">${m.message}</div>
                                <div class="text-[10px] text-right opacity-60">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                            </div>
                        `;
                    }).join('');
                    
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) return;

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/reports/${trackingCode}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sender_type: 'applicant' })
                });

                if (response.ok) {
                    input.value = '';
                    loadMessages();
                } else {
                    alert('Не удалось отправить сообщение');
                }
            } catch (error) {
                console.error(error);
                alert('Ошибка соединения с сервером');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
