<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа «Отклик» — Вход для сотрудников</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8f9fa; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.01); display: flex; flex-direction: column; gap: 24px; text-align: center; }
        .logo-box { width: 56px; height: 56px; background: #0f172a; color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: 800; color: #0f172a; }
        p { font-size: 14px; color: #64748b; line-height: 1.5; }
        .btn-gos { background: #0056b3; color: white; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: background 0.2s; text-decoration: none; }
        .btn-gos:hover { background: #004494; }
        .back-link { font-size: 13px; color: #64748b; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: #0f172a; }
        .divider { height: 1px; background: #e2e8f0; width: 100%; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">🛡️</div>
        
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1>Вход для сотрудников</h1>
            <p>Авторизуйтесь через единую систему идентификации (Госуслуги / ЕСИА) для подтверждения прав доступа к модерации.</p>
        </div>

        <div>
            <button onclick="handleLogin()" class="btn-gos">
                <span>Войти через Госуслуги / ЕСИА</span>
            </button>
        </div>

        <div class="divider"></div>

        <div>
            <a href="index.html" class="back-link">&larr; Вернуться на главную</a>
        </div>
    </div>

    <script>
        function handleLogin() {
            alert('Авторизация успешна! Переход в панель модератора...');
        }
    </script>
</body>
</html>
